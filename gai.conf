# /etc/gai.conf for containers on IPv6-only hosts (Docker ULA + NAT66).
# Problem (RFC 6724 rule 6, matching labels): a ULA source (label 6) is
# "closer" to an IPv4-mapped destination (label 4, diff 2) than to a global
# IPv6 destination (label 1, diff 5), so getaddrinfo() sorts IPv4 first and
# libraries without Happy Eyeballs hang on dead IPv4. There is no IPv4 here,
# so IPv6 must sort first. Setting the global-IPv6 label equal to the ULA
# source label (diff 0) restores IPv6-first ordering.
label ::1/128 0
label ::/0 6
label 2002::/16 2
label ::/96 3
label ::ffff:0:0/96 4
label fec0::/10 5
label fc00::/7 6
label 2001:0::/32 7
