<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reviews Missing Score - Metacritic</title>
</head>
<body>
  <div class="c-reviews-list">
    <!-- Card 1: critic with 'tbd' score -->
    <div class="flex flex-col items-center bg-gray-50 rounded-md h-full min-h-81 w-full" data-testid="review-card">
      <div class="flex flex-col items-start flex-auto overflow-hidden p-4 w-full" data-testid="review-card-content">
        <div data-testid="review-card-date">Mar 01, 2022</div>
        <a data-testid="review-card-header" href="/publication/in-progress-mag/">
          <div class="c-siteReviewScore_background"><div class="c-siteReviewScore" aria-label="Review in progress"><span>tbd</span></div></div>
          In Progress Mag
        </a>
        <div data-testid="review-card-quote-block">
          <div data-testid="review-quote-text">Review in progress. We are 40 hours in and will assign a final score after completing the story.</div>
        </div>
      </div>
      <div data-testid="review-card-footer">
        <span data-testid="review-platform">PlayStation 5</span>
        <a data-testid="review-full-review-link" href="https://example.com/wip"><span>FULL REVIEW</span></a>
      </div>
    </div>

    <!-- Card 2: user with '--' score -->
    <div class="flex flex-col items-center bg-gray-50 rounded-md h-full min-h-81 w-full" data-testid="review-card">
      <div class="flex flex-col items-start flex-auto overflow-hidden p-4 w-full" data-testid="review-card-content">
        <div data-testid="review-card-date">Mar 02, 2022</div>
        <a data-testid="review-card-header" href="/user/unscored_user/">
          <div class="c-siteReviewScore_background"><div class="c-siteReviewScore"><span>--</span></div></div>
          unscored_user
        </a>
        <div data-testid="review-card-quote-block">
          <div data-testid="review-quote-text">Left no numerical score, but leaving thoughts on performance.</div>
        </div>
      </div>
      <div data-testid="review-card-footer">
        <span data-testid="review-platform">PC</span>
      </div>
    </div>
  </div>
</body>
</html>
