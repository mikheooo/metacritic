<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Total War: Warhammer III for PC Reviews - Metacritic</title>
  <meta property="og:title" content="Total War: Warhammer III" />
  <meta property="og:image" content="https://www.metacritic.com/a/img/warhammer3.jpg" />
  <meta property="og:description" content="The cataclysmic conclusion to the Total War: WARHAMMER trilogy is coming." />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Total War: Warhammer III",
    "description": "The cataclysmic conclusion to the Total War: WARHAMMER trilogy is coming. Rally your forces and step into the Realm of Chaos.",
    "image": "https://www.metacritic.com/a/img/warhammer3.jpg",
    "url": "https://www.metacritic.com/game/total-war-warhammer-iii/"
  }
  </script>
</head>
<body>
  <div class="product-hero">
    <div data-testid="hero-title" class="hero-title">
      <h1 class="hero-title__text">Total War: Warhammer III</h1>
    </div>

    <div data-testid="platform-selector" class="c-hero-platform-selector">
      <div class="c-hero-platform-selector__label">
        <span title="PC">PC</span>
      </div>
      <div class="platform-options">
        <a href="/game/total-war-warhammer-iii/critic-reviews/?platform=pc">PC</a>
      </div>
    </div>

    <div data-testid="hero-summary-developer" class="developer-info">
      <span>Developer:</span>
      <a href="/company/creative-assembly/">Creative Assembly</a>
    </div>

    <!-- Metascore -->
    <div data-testid="product-score" class="score-card">
      <div data-testid="global-score-header">Metascore</div>
      <div data-testid="global-score-value">85</div>
      <a data-testid="global-score-review-count-link" href="/game/total-war-warhammer-iii/critic-reviews/?platform=pc">Based on 60 Reviews</a>
    </div>

    <!-- User Score -->
    <div data-testid="product-score" class="score-card">
      <div data-testid="global-score-header">User score</div>
      <div data-testid="global-score-value">8.2</div>
      <a data-testid="global-score-review-count-link" href="/game/total-war-warhammer-iii/user-reviews/?platform=pc">Based on 450 Ratings</a>
    </div>

    <div data-testid="featured-trailer" class="video-container">
      <iframe src="https://www.youtube.com/embed/xyz123" title="Warhammer III Trailer"></iframe>
    </div>
  </div>
</body>
</html>
