<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elden Ring User Reviews Page 1 - Metacritic</title>
</head>
<body>
  <div class="c-reviews-list">
    <!-- User Review 1 -->
    <div class="flex flex-col items-center bg-gray-50 rounded-md h-full min-h-81 w-full" data-testid="review-card">
      <div class="flex flex-col items-start flex-auto overflow-hidden p-4 w-full" data-testid="review-card-content">
        <div data-testid="review-card-date">Mar 01, 2022</div>
        <a data-testid="review-card-header" href="/user/elden_fan/">
          <div class="c-siteReviewScore_background c-siteReviewScore_background-user"><div class="c-siteReviewScore" aria-label="User score 10 out of 10"><span>10</span></div></div>
          elden_fan
        </a>
        <div data-testid="review-card-quote-block">
          <div data-testid="review-quote-text">A thrilling adventure with boundless secrets. Never stopped playing for 300 hours.</div>
        </div>
      </div>
      <div data-testid="review-card-footer">
        <span data-testid="review-platform">PlayStation 5</span>
      </div>
    </div>

    <!-- User Review 2 -->
    <div class="flex flex-col items-center bg-gray-50 rounded-md h-full min-h-81 w-full" data-testid="review-card">
      <div class="flex flex-col items-start flex-auto overflow-hidden p-4 w-full" data-testid="review-card-content">
        <div data-testid="review-card-date">Mar 02, 2022</div>
        <a data-testid="review-card-header" href="/user/rpg_critic/">
          <div class="c-siteReviewScore_background c-siteReviewScore_background-user"><div class="c-siteReviewScore" aria-label="User score 7 out of 10"><span>7</span></div></div>
          rpg_critic
        </a>
        <div data-testid="review-card-quote-block">
          <div data-testid="review-quote-text">Good combat, but the open world dilutes the tight level design of previous FromSoft entries.</div>
        </div>
      </div>
      <div data-testid="review-card-footer">
        <span data-testid="review-platform">PlayStation 5</span>
      </div>
    </div>

    <!-- Pagination -->
    <nav class="c-navigationPagination" data-testid="pagination">
      <span class="c-navigationPagination_item c-navigationPagination_item--active">1</span>
      <a class="c-navigationPagination_item" href="/game/elden-ring/user-reviews/?page=2">2</a>
      <a class="c-navigationPagination_item c-navigationPagination_item--next" data-testid="pagination-next" href="/game/elden-ring/user-reviews/?page=2">Next</a>
    </nav>
  </div>
</body>
</html>
