<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elden Ring for PlayStation 5 Reviews - Metacritic</title>
  <meta property="og:title" content="Elden Ring" />
  <meta property="og:image" content="https://www.metacritic.com/a/img/eldenring.jpg" />
  <meta property="og:description" content="A New World Created By Hidetaka Miyazaki And George R. R. Martin." />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Elden Ring",
    "description": "A New World Created By Hidetaka Miyazaki And George R. R. Martin. Rise, Tarnished, and be guided by grace to brandish the power of the Elden Ring.",
    "image": "https://www.metacritic.com/a/img/eldenring.jpg",
    "url": "https://www.metacritic.com/game/elden-ring/"
  }
  </script>
</head>
<body>
  <div class="product-hero">
    <div data-testid="hero-title" class="hero-title">
      <h1 class="hero-title__text">Elden Ring</h1>
    </div>

    <div data-testid="platform-selector" class="c-hero-platform-selector">
      <div class="c-hero-platform-selector__label">
        <span title="PlayStation 5">PlayStation 5</span>
      </div>
      <div class="platform-options">
        <a href="/game/elden-ring/critic-reviews/?platform=playstation-5">PlayStation 5</a>
        <a href="/game/elden-ring/critic-reviews/?platform=pc">PC</a>
        <a href="/game/elden-ring/critic-reviews/?platform=xbox-series-x">Xbox Series X</a>
        <a href="/game/elden-ring/critic-reviews/?platform=playstation-4">PlayStation 4</a>
      </div>
    </div>

    <div data-testid="hero-summary-developer" class="developer-info">
      <span>Developer:</span>
      <a href="/company/from-software/">FromSoftware</a>
    </div>

    <!-- Metascore -->
    <div data-testid="product-score" class="score-card">
      <div data-testid="global-score-header">Metascore</div>
      <div data-testid="global-score-value">96</div>
      <a data-testid="global-score-review-count-link" href="/game/elden-ring/critic-reviews/?platform=playstation-5">Based on 86 Reviews</a>
    </div>

    <!-- User Score -->
    <div data-testid="product-score" class="score-card">
      <div data-testid="global-score-header">User score</div>
      <div data-testid="global-score-value">7.8</div>
      <a data-testid="global-score-review-count-link" href="/game/elden-ring/user-reviews/?platform=playstation-5">Based on 12400 Ratings</a>
    </div>

    <!-- Featured Trailer -->
    <div data-testid="featured-trailer" class="video-container">
      <iframe src="https://www.youtube.com/embed/E3Huy2cdih0" title="Elden Ring Official Trailer"></iframe>
    </div>
  </div>
</body>
</html>
