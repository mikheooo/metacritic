<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elden Ring Spoiler Review - Metacritic</title>
</head>
<body>
  <div class="c-reviews-list">
    <div class="flex flex-col items-center bg-gray-50 rounded-md h-full min-h-81 w-full" data-testid="review-card">
      <div class="flex flex-col items-start flex-auto overflow-hidden p-4 w-full" data-testid="review-card-content">
        <div data-testid="review-card-date">Mar 12, 2022</div>
        <a data-testid="review-card-header" href="/user/lore_master/">
          <div class="c-siteReviewScore_background c-siteReviewScore_background-user"><div class="c-siteReviewScore" aria-label="User score 9 out of 10"><span>9</span></div></div>
          lore_master
        </a>
        <div data-testid="review-card-quote-block">
          <div data-testid="review-quote-text">
            <span class="c-spoiler_warning">Contains Spoilers: </span>
            The revelation about Radagon being Marika blew my mind. The entire finale in Leyndell is unmatched.
            <span data-testid="review-quote-read-more" class="hidden">Read More</span>
          </div>
        </div>
      </div>
      <div data-testid="review-card-footer">
        <span data-testid="review-platform">PC</span>
      </div>
    </div>
  </div>
</body>
</html>
