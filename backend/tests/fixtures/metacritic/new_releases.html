<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Video Game Releases - Metacritic</title>
</head>
<body>
  <div class="global-header-title">
    <h2 class="global-header-title__text">New Releases</h2>
    <div class="global-header-title__link">
      <a data-testid="section-see-all-link" href="/browse/game/all/all/all-time/new/">See All</a>
    </div>
  </div>

  <div class="carousel-products" data-testid="carousel-products">
    <!-- Game 1 -->
    <div data-testid="product-card" class="c-productCard">
      <a data-testid="product-card-link" href="/game/nba-2k27/">
        <div data-testid="product-card-image-container">
          <img src="https://www.metacritic.com/a/img/nba2k27.jpg" alt="NBA 2K27" />
        </div>
        <h3 data-testid="product-card-title">NBA 2K27</h3>
        <div data-testid="product-card-score">
          <span>82</span>
        </div>
      </a>
    </div>

    <!-- Game 2 -->
    <div data-testid="product-card" class="c-productCard">
      <a data-testid="product-card-link" href="/game/onimusha-way-of-the-sword/">
        <div data-testid="product-card-image-container">
          <img src="https://www.metacritic.com/a/img/onimusha.jpg" alt="Onimusha: Way of the Sword" />
        </div>
        <h3 data-testid="product-card-title">Onimusha: Way of the Sword</h3>
        <div data-testid="product-card-score">
          <span>89</span>
        </div>
      </a>
    </div>

    <!-- Game 3 -->
    <div data-testid="product-card" class="c-productCard">
      <a data-testid="product-card-link" href="/game/orbitals/">
        <div data-testid="product-card-image-container">
          <img src="https://www.metacritic.com/a/img/orbitals.jpg" alt="Orbitals" />
        </div>
        <h3 data-testid="product-card-title">Orbitals</h3>
        <div data-testid="product-card-score">
          <span>76</span>
        </div>
      </a>
    </div>

    <!-- Game 4 -->
    <div data-testid="product-card" class="c-productCard">
      <a data-testid="product-card-link" href="/game/the-blood-of-dawnwalker/">
        <div data-testid="product-card-image-container">
          <img src="https://www.metacritic.com/a/img/dawnwalker.jpg" alt="The Blood of Dawnwalker" />
        </div>
        <h3 data-testid="product-card-title">The Blood of Dawnwalker</h3>
        <div data-testid="product-card-score">
          <span>91</span>
        </div>
      </a>
    </div>

    <!-- Game 5 -->
    <div data-testid="product-card" class="c-productCard">
      <a data-testid="product-card-link" href="/game/bioeden/">
        <div data-testid="product-card-image-container">
          <img src="https://www.metacritic.com/a/img/bioeden.jpg" alt="BioEden" />
        </div>
        <h3 data-testid="product-card-title">BioEden</h3>
        <div data-testid="product-card-score">
          <span>68</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
