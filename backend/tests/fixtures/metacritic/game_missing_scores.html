<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Indie Mystery Game Reviews - Metacritic</title>
  <meta property="og:title" content="Indie Mystery Game" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Indie Mystery Game",
    "url": "https://www.metacritic.com/game/indie-mystery-game/"
  }
  </script>
</head>
<body>
  <div class="product-hero">
    <div data-testid="hero-title" class="hero-title">
      <h1 class="hero-title__text">Indie Mystery Game</h1>
    </div>

    <div data-testid="platform-selector" class="c-hero-platform-selector">
      <div class="c-hero-platform-selector__label">
        <span title="PC">PC</span>
      </div>
      <div class="platform-options">
        <a href="/game/indie-mystery-game/critic-reviews/?platform=pc">PC</a>
      </div>
    </div>

    <!-- Metascore TBD -->
    <div data-testid="product-score" class="score-card">
      <div data-testid="global-score-header">Metascore</div>
      <div data-testid="global-score-value">tbd</div>
    </div>

    <!-- User Score TBD -->
    <div data-testid="product-score" class="score-card">
      <div data-testid="global-score-header">User score</div>
      <div data-testid="global-score-value">tbd</div>
    </div>
  </div>
</body>
</html>
