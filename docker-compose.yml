services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: metacritic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metacritic
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metacritic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metacritic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metacritic-backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/metacritic
      - DATABASE_SYNC_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/metacritic
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - CRAWL_SCHEDULE_ENABLED=true
      - CRAWL_BATCH_LIMIT=20
      - MANUAL_RUN_COOLDOWN_SECONDS=${MANUAL_RUN_COOLDOWN_SECONDS:-60}
      - CELERY_TIMEZONE=UTC
      - CRAWL_SCHEDULE_MINUTE=0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o-mini}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openrouter}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_ENABLED=${YOUTUBE_ENABLED:-true}
      - YOUTUBE_SEARCH_RESULTS_LIMIT=${YOUTUBE_SEARCH_RESULTS_LIMIT:-10}
      - YOUTUBE_TRANSCRIPT_LANGUAGES=${YOUTUBE_TRANSCRIPT_LANGUAGES:-en,ru}
      - YOUTUBE_SEARCH_REFRESH_HOURS=${YOUTUBE_SEARCH_REFRESH_HOURS:-24}
      - YOUTUBE_PROMPT_VERSION=${YOUTUBE_PROMPT_VERSION:-v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metacritic-celery-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/metacritic
      - DATABASE_SYNC_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/metacritic
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - CRAWL_SCHEDULE_ENABLED=true
      - CRAWL_BATCH_LIMIT=20
      - MANUAL_RUN_COOLDOWN_SECONDS=${MANUAL_RUN_COOLDOWN_SECONDS:-60}
      - CELERY_TIMEZONE=UTC
      - CRAWL_SCHEDULE_MINUTE=0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o-mini}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openrouter}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_ENABLED=${YOUTUBE_ENABLED:-true}
      - YOUTUBE_SEARCH_RESULTS_LIMIT=${YOUTUBE_SEARCH_RESULTS_LIMIT:-10}
      - YOUTUBE_TRANSCRIPT_LANGUAGES=${YOUTUBE_TRANSCRIPT_LANGUAGES:-en,ru}
      - YOUTUBE_SEARCH_REFRESH_HOURS=${YOUTUBE_SEARCH_REFRESH_HOURS:-24}
      - YOUTUBE_PROMPT_VERSION=${YOUTUBE_PROMPT_VERSION:-v1}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metacritic-celery-beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/metacritic
      - DATABASE_SYNC_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/metacritic
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - CRAWL_SCHEDULE_ENABLED=true
      - CRAWL_BATCH_LIMIT=20
      - CELERY_TIMEZONE=UTC
      - CRAWL_SCHEDULE_MINUTE=0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o-mini}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openrouter}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_ENABLED=${YOUTUBE_ENABLED:-true}
      - YOUTUBE_SEARCH_RESULTS_LIMIT=${YOUTUBE_SEARCH_RESULTS_LIMIT:-10}
      - YOUTUBE_TRANSCRIPT_LANGUAGES=${YOUTUBE_TRANSCRIPT_LANGUAGES:-en,ru}
      - YOUTUBE_SEARCH_REFRESH_HOURS=${YOUTUBE_SEARCH_REFRESH_HOURS:-24}
      - YOUTUBE_PROMPT_VERSION=${YOUTUBE_PROMPT_VERSION:-v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metacritic-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: metacritic-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  postgres_data:
